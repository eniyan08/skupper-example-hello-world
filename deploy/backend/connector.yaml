# Skupper Connector: binds routing key "backend" to the pods labelled app=backend
# in rms-in. Traffic arriving from the Listener in dev-out is delivered here.
#
# Requires: the Skupper site (skupper-backend-site) already exists in rms-in.
apiVersion: skupper.io/v2alpha1
kind: Connector
metadata:
  name: backend
spec:
  routingKey: backend
  selector: app=backend
  port: 8080
